# SPDX-License-Identifier: Apache-2.0
# =============================================================================
# chip_top  -  FULL CHIP (pad ring + seal ring + fill) with LibreLane "Chip"
#              flow on sky130A.  Core = coralnpu_soc (flattened) + 20 SRAMs.
#
# Variant: FULL  (CoreMiniAxi: RV32IMF, ITCM 8 KiB + DTCM 32 KiB)
# Run with:  make chip
# =============================================================================
meta:
  version: 3
  flow: Chip
  substituting_steps:
    # Magic reports pad/filler overlaps that can be ignored (same as the
    # LibreLane full_chip_sky130 reference design)
    Checker.IllegalOverlap: null

DESIGN_NAME: chip_top

VERILOG_FILES:
  - dir::../../rtl/generated/CoralNPUCore.sv
  - dir::../../rtl/sky130/Sram_sky130.v
  - dir::../../rtl/sky130/ClockGate_sky130.v
  - dir::../../rtl/soc/spi_axi_bridge.v
  - dir::../../rtl/soc/axi_gpio_slave.v
  - dir::../../rtl/soc/coralnpu_soc.v
  - dir::../../rtl/chip/chip_top.v

USE_SLANG: true
RUN_LINTER: false

# ---------------------------------------------------------------- clocking
CLOCK_PORT: clk_PAD
CLOCK_NET: pad_clk/IN
CLOCK_PERIOD: 40              # ns -> 25 MHz
PNR_SDC_FILE: dir::chip_top.sdc
SIGNOFF_SDC_FILE: dir::chip_top.sdc

# ---------------------------------------------------------------- die / core
# sky130_ef_io pads are 200 um tall, corners 200 x 204 um (seal ring is
# added outside DIE_AREA by KLayout.SealRing).
FP_SIZING: absolute
DIE_AREA:  [0, 0, 5000, 5000]
CORE_AREA: [300, 300, 4700, 4700]
# Utilisation is low (~15-20 %): a moderate target density plus non-routability-
# driven global placement avoids RePlAce divergence (GPL-0305) caused by the
# huge routability inflation around the SRAM buses.
PL_TARGET_DENSITY_PCT: 30
PL_ROUTABILITY_DRIVEN: false
FP_MACRO_HORIZONTAL_HALO: 20
FP_MACRO_VERTICAL_HALO: 20
RT_MAX_LAYER: met5

MACRO_PLACEMENT_CFG: dir::macro_placement.cfg

# ---------------------------------------------------------------- pad ring
# Pad spacing is snapped to a multiple of 2 um (LibreLane >= 3.1) so the
# remaining space is always divisible by the 1 um pad site.
PAD_SPACING_MULTIPLE: 2.0
# The PAD_* lists between the markers are rewritten by scripts/gen_chip_top.py
# >>> PADS (generated)
PAD_SOUTH:
  - pad_vssio_0
  - pad_clk
  - pad_rst_n
  - pad_vccd_0
  - pad_vssd_0
  - pad_spi_sck
  - pad_spi_csb
  - pad_vddio_0
PAD_EAST:
  - pad_spi_mosi
  - pad_spi_miso
  - pad_irq
  - pad_gpio_in0
  - pad_gpio_in1
  - pad_gpio_in2
  - pad_gpio_in3
PAD_NORTH:
  - pad_vssio_1
  - pad_gpio_out0
  - pad_gpio_out1
  - pad_gpio_out2
  - pad_gpio_out3
  - pad_vccd_1
  - pad_vssd_1
  - pad_vddio_1
PAD_WEST:
  - pad_gpio_out4
  - pad_gpio_out5
  - pad_gpio_out6
  - pad_gpio_out7
  - pad_halted
  - pad_fault
  - pad_wfi
# <<< PADS

# ---------------------------------------------------------------- power
VDD_NETS: [VCCD]
GND_NETS: [VSSD]
# Pad power pins come from the USE_POWER_PINS connections in chip_top.v;
# the SRAMs sit inside flattened Chisel logic, so hook them up explicitly.
PDN_MACRO_CONNECTIONS:
  - ".*u_sky130sram.* VCCD VSSD vccd1 vssd1"
PDN_ENABLE_PINS: false
PDN_CORE_RING: true
PDN_CORE_RING_VWIDTH: 15            # < 30 um: no metal slotting required
PDN_CORE_RING_HWIDTH: 15
PDN_CORE_RING_VSPACING: 5
PDN_CORE_RING_HSPACING: 5
PDN_CORE_VERTICAL_LAYER: met2
PDN_CORE_HORIZONTAL_LAYER: met3
PDN_CORE_RING_CONNECT_TO_PADS: true
PDN_CORE_RING_CONNECT_TO_PAD_LAYERS: [met3]
PDN_HORIZONTAL_HALO: 15
PDN_VERTICAL_HALO: 15
ERROR_ON_PDN_VIOLATIONS: false      # pad terminals give false positives

# Internal pad sub-cells that have no signal connections by design
IGNORE_DISCONNECTED_MODULES:
  - sky130_fd_sc_hd__conb_1
  - sky130_fd_io__top_power_hvc_wpad
  - sky130_fd_io__top_ground_hvc_wpad
  - sky130_fd_io__top_power_lvc_wpad
  - sky130_fd_io__top_ground_lvc_wpad

# ---------------------------------------------------------------- macros
MACROS:
  sky130_sram_2kbyte_1rw1r_32x512_8:
    gds:
      - pdk_dir::libs.ref/sky130_sram_macros/gds/sky130_sram_2kbyte_1rw1r_32x512_8.gds
    lef:
      - pdk_dir::libs.ref/sky130_sram_macros/lef/sky130_sram_2kbyte_1rw1r_32x512_8.lef
    vh:
      - pdk_dir::libs.ref/sky130_sram_macros/verilog/sky130_sram_2kbyte_1rw1r_32x512_8.v
    lib:
      "*":
        - pdk_dir::libs.ref/sky130_sram_macros/lib/sky130_sram_2kbyte_1rw1r_32x512_8_TT_1p8V_25C.lib
    spice:
      - pdk_dir::libs.ref/sky130_sram_macros/spice/sky130_sram_2kbyte_1rw1r_32x512_8.spice
    instances: {}

# ---------------------------------------------------------------- routing / misc
GRT_ALLOW_CONGESTION: true
RUN_HEURISTIC_DIODE_INSERTION: true
ERROR_ON_KLAYOUT_DRC: false   # OpenRAM bitcells + OpenROAD issue #10256
ERROR_ON_KLAYOUT_DENSITY: false
